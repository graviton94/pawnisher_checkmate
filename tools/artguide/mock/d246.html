const font = (px, f = 'G14', b = false) => `${b ? '700 ' : ''}${px}px ${f}`;

/** 한 자씩 (D-193 서술 = 타자) */
const typed = (s, t, t0, ms = 45) => s.slice(0, Math.max(0, Math.floor((t - t0) / ms)));
const img = {};
const load = (k, src) => new Promise((ok) => { const i = new Image(); i.onload = () => { img[k] = i; ok(); }; i.onerror = () => ok(); i.src = src; });
/** 검은 기물 속 칠을 반장 색으로 (외곽선 · 흰 테는 그대로 — D-221 흑백 통일 문법) */
const tint = (src, ramp) => {

  for (let i = 0; i < p.length; i += 4) {

};
/** 기물 (72도트 그림을 hi 위에 1도트 = 1px로) */
const piece = (k, x, y, size = 72) => { const i = img[k]; if (i) hi.drawImage(i, Math.round(x), Math.round(y), size, size); };

// ── 반장 셋: 초상화에서 뽑은 색 ──
const BOSS = {
  plate: { act: '1막 반장', name: '철갑 반장', title: '용광로를 등에 진 자', rule: '철갑 20 · 두 턴마다 불꽃 줄 폭격', art: 'boss-plate',
    accent: '#ff8a3a', ramp: ['#1a0f0c', '#291c20', '#442b2b', '#6e3a26', '#ae5d2f'], tiles: ['#2b1f1e', '#1d1515'], rivet: '#ff8a3a', bar: '#ae5d2f' },
  spawn: { act: '2막 반장', name: '조립 반장', title: '끝없이 찍어 내는 손', rule: '두 턴마다 곁에 폰을 찍어 낸다 · 셋까지', art: 'boss-assembly',
    accent: '#5fd4d8', ramp: ['#090c10', '#14171d', '#1c2a32', '#2a4a52', '#35676e'], tiles: ['#26303a', '#1a2129'], rivet: '#5fd4d8', bar: '#35676e' },
  thorns: { act: '3막 반장', name: '출하 반장', title: '가시 갑옷의 문지기', rule: '못 쓰러뜨리면 가시가 되돌아온다', art: 'boss-thorns',
    accent: '#e5262f', ramp: ['#0d0d12', '#1a1a22', '#2a2c36', '#5a1c22', '#a8282e'], tiles: ['#3a3e4a', '#2a2c36'], rivet: '#e5262f', bar: '#7a1e22' },
};

/** 반장 판 칸 (lo 좌표) — 반장마다 칸 무늬가 다르다 */
const tile = (c, bk, x, y, s, dark, t = 0) => {
  const b = BOSS[bk];
  R(c, x, y, s, s, dark ? b.tiles[1] : b.tiles[0]);
  R(c, x, y, s, 1, INK); R(c, x, y, 1, s, INK);
  if (bk === 'plate') { // 그을린 철판 · 어두운 칸에 쇳물 금
    R(c, x + 2, y + 2, 1, 1, b.rivet); R(c, x + s - 3, y + s - 3, 1, 1, b.rivet);
    if (dark) { const g = Math.floor(t / 250 + x) % 3 === 0 ? '#ffb35a' : '#ae5d2f'; R(c, x + 3, y + s / 2, s / 2 - 2, 1, g); R(c, x + s / 2, y + s / 2, 1, s / 3, g); }
  } else if (bk === 'spawn') { // 컨베이어 철판 · 청록 램프 점 · 화살 무늬
    R(c, x + 2, y + 2, 1, 1, '#0d0e12'); R(c, x + s - 3, y + 2, 1, 1, '#0d0e12');

    R(c, x + 2, y + 2, 1, 1, b.rivet); R(c, x + s - 3, y + s - 3, 1, 1, b.rivet);
    if (dark) { R(c, x + s / 2, y + 3, 1, 2, '#1a1a22'); R(c, x + s / 2 - 1, y + 5, 3, 1, '#1a1a22'); }
  }
};

// ── 장면들 ──
const SCENES = {};

/** 9. 반장 등장 — 영화 띠가 닫히고 → 빛번쩍 → 초상화가 물러섰다 꽂힌다 → 이름이 내리꽂히고 → 칭호 · 규칙이 한 자씩 → 띠가 닫혔다 열리며 반장 판으로 */
const bossIntro = (bk) => (t) => {
  const b = BOSS[bk]; const DUR = 4200;
  // 바탕: 반장 판을 디더로 어둡게
  for (let y = 0; y < 6; y++) for (let x = 0; x < 13; x++) tile(B, bk, x * 24 - 6, y * 24 - 8, 24, (x + y) % 2 === 1, t);
  dither(B, 0.75, INK);
  const barH = 28;

  // 빛번쩍 한 장 (240~320): 반장 색 체크
  if (t >= 240 && t < 320) dither(B, 0.5, b.accent);
  // 앞 효과 (도트)
  if (t > 560 && t < 3800) bossFx(bk, t, win);

  if (bh > 2 && t < 3500) { const flash = t >= 560 && t < 680; R(F, 0, win.y, W, 1, flash ? '#fff' : b.bar); R(F, 0, win.y + win.h - 1, W, 1, flash ? '#fff' : b.bar); }
  // 조립: 아래 띠 위 컨베이어 폰
  if (bk === 'spawn' && t > 560 && t < 3500) for (let i = 0; i < 9; i++) { const x = ((i * 40 + Math.floor(t / 83) * 2) % (W + 40)) - 20; R(F, x, win.y + win.h + 6, 5, 2, '#35676e'); R(F, x + 1, win.y + win.h + 3, 3, 3, '#35676e'); R(F, x + 2, win.y + win.h + 1, 1, 2, '#35676e'); }
  compose(() => {

    // 이름: 색 갈림 두 장 → 제자리 (낙하 12→0px 계단)

      T(b.name, ex, win.y * S + 132 - dy, 60, '#f4f1ea');

    T(typed(b.title, t, 900, 70), ex, win.y * S + 180, 24, '#f4d27a', 'G11', true);
    T(typed('「' + b.rule + '」', t, 1700, 40), 457, (win.y + win.h) * S + 52, 15, '#e9e2d4', 'G14', false, 'center');
  });
  if (t > 3800) { // 띠가 열리면 반장 판
    // (다음 대국 화면으로 이어짐을 보여 준다)
  }
  return DUR;
};
/** 반장별 앞 효과 */
const bossFx = (bk, t, win) => {
  const b = BOSS[bk];
  if (bk === 'plate') {
    // 불씨: 아래에서 위로, 3색 깜빡 (프레임마다 1도트씩 · 계단)
    for (let i = 0; i < 46; i++) {
      const life = 1400 + rnd(i) * 900; const ph = (t + rnd(i + 9) * life) % life; const k = ph / life;
      const x = Math.round(rnd(i + 3) * W + Math.sin(k * 6 + i) * 3); const y = Math.round(win.y + win.h - k * (win.h + 10));
      F.fillStyle = ['#ffb35a', '#ff8a3a', '#e5262f'][Math.floor(t / 83 + i) % 3]; F.fillRect(x, y, 1, 1);
    }

    const f = Math.floor(t / 120);
    for (let x = 0; x < W; x += 3) { const h = 2 + Math.floor(rnd(x * 7 + f) * 7); R(F, x, win.y + win.h - h, 3, h, h > 6 ? '#ffb35a' : '#ae5d2f'); }
  } else if (bk === 'spawn') {
    // 청록 훑는 줄: 600ms마다 위→아래 4도트 계단
    const y = win.y + (Math.floor(((t % 600) / 600) * (win.h / 4)) * 4);
    R(F, W - 170, y, 170, 1, '#5fd4d8'); dither(F, 0.25, '#5fd4d8', W - 170, y + 1, 170, 3);
    // 램프 불꽃 (오른쪽 위)
    for (let i = 0; i < 14; i++) { const ph = (t + i * 97) % 700; const k = outE(ph / 700); const a = rnd(i) * Math.PI - Math.PI; F.fillStyle = i % 2 ? '#5fd4d8' : '#e8fbfc'; F.fillRect(Math.round(W - 70 + Math.cos(a) * k * 30), Math.round(win.y + 14 + Math.abs(Math.sin(a)) * k * 24), 1, 1); }
  } else {
    // 등장 순간 붉은 가시 파편이 사방으로 (감속) → 떨어짐
    if (t < 1500) for (let i = 0; i < 30; i++) {
      const a = rnd(i) * Math.PI * 2; const sp = 40 + rnd(i + 5) * 60; const k = outE((t - 560) / 700);
      const x = W - 105 + Math.cos(a) * sp * k; const y = H / 2 + Math.sin(a) * sp * k * 0.6 + inE((t - 900) / 600) * 30;

  }
};
SCENES['boss-plate'] = bossIntro('plate');
SCENES['boss-spawn'] = bossIntro('spawn');
SCENES['boss-thorns'] = bossIntro('thorns');

/** 10. 반장 판 셋: 초상화 색으로 칸 · 기물 속 칠 */
SCENES['boss-boards'] = (t) => {

  const keys = ['plate', 'spawn', 'thorns'];
  keys.forEach((bk, n) => { const ox = 4 + n * 101; for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) tile(B, bk, ox + x * 24, 26 + y * 24, 24, (x + y) % 2 === 1, t); R(B, ox, 122, 97, 1, INK); R(B, ox + 96, 26, 1, 97, INK); });
  compose(() => {
    keys.forEach((bk, n) => {
      const ox = (4 + n * 101) * S; const b = BOSS[bk];
      T(b.name, ox + 4, 40, 24, b.accent, 'G11', true);
      T(bk === 'plate' ? '그을린 철판 · 쇳물 금' : bk === 'spawn' ? '컨베이어 · 청록 램프' : '닦은 쇠 · 붉은 리벳', ox + 4, 66, 12, '#a8a2b0', 'G11');
      piece(`K-${bk}`, ox + 72 * 1, 78 + 0, 72); piece(`P-${bk}`, ox + 0, 78 + 72, 72); piece(`R-${bk}`, ox + 72 * 3, 78, 72); piece(`N-${bk}`, ox + 72 * 2, 78 + 72, 72);
      piece('P0', ox + 72 * 1, 78 + 144, 72); piece('N0', ox + 72 * 3, 78 + 144, 72);
    });
  });

};

/** 10. 반장 기믹 연출 */
const board4 = (bk, t, rows = 4) => { for (let y = 0; y < rows; y++) for (let x = 0; x < 7; x++) tile(B, bk, 47 + x * 30, 8 + y * 30, 30, (x + y) % 2 === 1, t); };
const TS = 30; const BX = 47, BY = 8;
const at = (x, y) => [(BX + x * TS) * S, (BY + y * TS) * S];
SCENES['fx-plate'] = (t) => {
  const DUR = 2400; board4('plate', t);
  const row = 2;
  // 0~700 예고: 붉은 띠가 150ms 계단으로 깜빡 · 바닥 불꽃 점
  if (t < 700 && Math.floor(t / 150) % 2 === 0) for (let x = 0; x < 7; x++) { R(B, BX + x * TS + 1, BY + row * TS + 1, TS - 1, TS - 1, '#5a1a14'); dither(B, 0.5, '#e5262f', BX + x * TS + 1, BY + row * TS + 1, TS - 1, TS - 1); }
  // 700~780 예비: 판 전체 한 장 어둡게
  if (t >= 700 && t < 780) dither(B, 0.5, INK);
  // 780~ 불기둥: 3계단으로 솟고, 1300부터 디더로 꺼짐
  if (t >= 780) {
    const k = st((t - 780) / 160, 3); const off = t > 1300 ? st((t - 1300) / 700, 6) : 0;
    for (let x = 0; x < 7; x++) {
      const cx = BX + x * TS; const top = BY + row * TS + TS - Math.round(k * (TS + 18));
      const f = Math.floor(t / 83);
      for (let c = 0; c < TS; c += 2) { const hgt = Math.round(k * (TS + 8 + rnd(x * 31 + c + f) * 14)); R(F, cx + c, BY + row * TS + TS - hgt, 2, hgt, c % 4 ? '#ff8a3a' : '#ffb35a'); }
      R(F, cx + 6, top + 10, TS - 12, 6, '#fff3c4');
