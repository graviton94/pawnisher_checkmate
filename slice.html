<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16141C">
  <link rel="icon" type="image/png" href="./favicon.png">
  <title>Pawnisher — 수직 조각</title>
</head>
<body class="slice">
  <div id="app">
    <main id="board"><div id="meter" class="meter" hidden></div></main>
    <aside id="right" class="rail">
      <div class="rail-head">
        <span id="turn-label" class="plate turn-label">1턴 · 내 차례</span>
        <button id="btn-help" class="btn sq" type="button" aria-label="규칙">?</button>
      </div>
      <div id="coins" class="coins" aria-label="나사 트랙"></div>
      <div id="hand" class="hand"></div>
      <div id="vials" class="springs" aria-label="남은 태엽"></div>
      <div class="actions">
        <button id="btn-rewind" class="btn rewind" type="button" title="되감기 — 이번 턴 처음으로 (대국마다 한 번)">되감기</button>
        <button id="btn-end" class="btn brass btn-go" type="button">턴 끝</button>
      </div>
    </aside>
  </div>
  <div id="info" class="info" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="overlay" class="overlay" hidden><div class="panel" id="overlay-panel"></div></div>
  <div id="rotate" class="rotate"><p>화면을 가로로 돌린다</p></div>
  <script type="module" src="/src/slice/main.ts"></script>
</body>
</html>
