<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16141C">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Pawnisher : Checkmate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <main id="board"></main>
    <aside id="right" class="rail">
      <div class="rail-head">
        <span id="turn-label" class="turn-label">내 차례 · 예약</span>
        <button id="btn-enchant" class="btn btn-ghost btn-enchant" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5 L9.8 6 L14.5 6.2 L10.8 9.1 L12.1 13.8 L8 11.1 L3.9 13.8 L5.2 9.1 L1.5 6.2 L6.2 6 Z"/></svg>
          인챈트
        </button>
      </div>
      <ol id="queue" class="queue"></ol>
      <div id="cards" class="cards"></div>
      <div id="vials" class="vials" aria-label="남은 AP"></div>
      <div class="actions">
        <button id="btn-undo" class="btn btn-ghost btn-icon" type="button" aria-label="마지막 예약 되돌리기" title="되돌리기 (Z)">
          <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5 L3 10 L8 15"/><path d="M3 10 H13 A5 5 0 0 1 13 20 H9"/></svg>
        </button>
        <button id="btn-reset" class="btn btn-ghost btn-icon" type="button" aria-label="예약 전체 초기화" title="초기화 (R)">
          <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5 L17 17 M17 5 L5 17"/></svg>
        </button>
        <button id="btn-submit" class="btn btn-submit" type="button" title="제출 (Space)">SUBMIT</button>
      </div>
    </aside>
  </div>

  <div id="info" class="info" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <div id="overlay" class="overlay" hidden>
    <div class="panel" id="overlay-panel"></div>
  </div>

  <div id="rotate" class="rotate">
    <p>화면을 가로로 돌려 주세요</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
