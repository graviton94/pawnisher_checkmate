# 테스트 + 안드로이드 APK + PC(Windows/macOS/Linux) 빌드 (GDD 10장 M7·M9)
# - push: 테스트와 웹 빌드만 (main 포함 — 자동 APK 없음, D-080)
# - 수동 실행: 안드로이드 출시 빌드 (D-635) — APK는 apk-latest 릴리스에, Play용 AAB는 7일짜리 Actions 아티팩트로
# - PC 설치 파일: v* 태그 또는 수동 pc 선택. -test. 태그는 Windows만, 그 밖의 태그는3개 OS.
name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      pc:
        description: 'PC 설치 파일도 만든다 (Windows/macOS/Linux, 약 430MB — 저장 용량을 쓴다)'
        type: boolean
        default: false
      release_tag:
        description: '검수 릴리스 이름 (예: v1.1.1-test.20261112.2). 주면 Actions가 그 이름으로 릴리스·태그를 만들어 설치 파일을 올린다 (-test. 이면 PC는 Windows만)'
        type: string
        default: ''
      make_key:
        description: '서명 키 만들기 (한 번만, D-479) — 고르면 키만 만들어 커밋하고 빌드는 하지 않는다. sideload = 직접 설치 APK, upload = Play AAB'
        type: choice
        options: [none, sideload, upload]
        default: none
      replace_key:
        description: '이미 있는 키를 새 키로 바꾸기 (테스터 모두 다시 설치해야 함)'
        type: boolean
        default: false
  # 태그 푸시는 위 push에도 걸린다
  # (기본 브랜치에 있는 이 파일만 손으로 실행할 수 있어서, 키 만들기도 여기 선택지로 둔다)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test
      - run: npm run build

  # 안드로이드 출시 빌드 (D-635): APK(직접 설치) + AAB(Google Play) 둘 다 release — 디버그 불가 · 원격 디버깅 없음 · R8 코드 줄이기.
  # 서명 (D-479 키를 그대로): 저장소의 잠긴 키(android/keystore/*.jks.gpg)를 Secrets 암호로 풀어 쓴다.
  #   APK = sideload 키 (SIDELOAD_PASSPHRASE) · AAB = upload 키 (ANDROID_UPLOAD_PASSPHRASE)
  #   키가 없으면 빌드는 멈추지 않고 시험용 디버그 키로 서명한다 — 파일 이름에 TESTKEY가 붙는다(AAB는 Play에 올릴 수 없다).
  android:
    needs: test
    permissions:
      contents: write
    if: (github.event_name == 'workflow_dispatch' && (inputs.make_key == 'none' || inputs.make_key == '')) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest 러너에는 안드로이드 SDK가 이미 설치되어 있다 (ANDROID_HOME)
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run android:sync
      - name: Unlock signing keys
        env:
          P_SIDELOAD: ${{ secrets.SIDELOAD_PASSPHRASE }}
          P_UPLOAD: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
        run: |
          if [ -n "$P_SIDELOAD" ] && [ -f android/keystore/sideload.jks.gpg ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 -d -o "$RUNNER_TEMP/sideload.jks" android/keystore/sideload.jks.gpg 3<<<"$P_SIDELOAD"
            echo "APK_KEY=sideload" >> "$GITHUB_ENV"
          else
            echo "APK_KEY=testkey" >> "$GITHUB_ENV"
            echo "::warning::직접 설치용 키가 없어 APK를 시험용 디버그 키로 서명합니다 (Secrets SIDELOAD_PASSPHRASE)"
          fi
          if [ -n "$P_UPLOAD" ] && [ -f android/keystore/upload.jks.gpg ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 -d -o "$RUNNER_TEMP/upload.jks" android/keystore/upload.jks.gpg 3<<<"$P_UPLOAD"
            echo "AAB_KEY=upload" >> "$GITHUB_ENV"
          else
            echo "AAB_KEY=testkey" >> "$GITHUB_ENV"
            echo "::warning::업로드 키가 없어 AAB를 시험용 디버그 키로 서명합니다 — Google Play에 올릴 수 없습니다 (Secrets ANDROID_UPLOAD_PASSPHRASE)"
          fi
      # APK: sideload 환경 변수만 넘긴다 → build.gradle release가 sideload(없으면 디버그 키)를 고른다
      - name: Build release APK
        working-directory: android
        env:
          PC_VERSION_NAME: ${{ inputs.release_tag || '' }}
          SIDELOAD_P: ${{ secrets.SIDELOAD_PASSPHRASE }}
        run: |
          [ -n "$PC_VERSION_NAME" ] || unset PC_VERSION_NAME
          if [ "$APK_KEY" = sideload ]; then
            export PC_SIDELOAD_STORE="$RUNNER_TEMP/sideload.jks" PC_SIDELOAD_STORE_PASSWORD="$SIDELOAD_P" PC_SIDELOAD_KEY_PASSWORD="$SIDELOAD_P"
          fi
          unset SIDELOAD_P
          ./gradlew assembleRelease
      # AAB: upload 환경 변수만 넘긴다 → build.gradle release가 upload(없으면 디버그 키)를 고른다
      - name: Build release AAB
        working-directory: android
        env:
          PC_VERSION_NAME: ${{ inputs.release_tag || '' }}
          UPLOAD_P: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
        run: |
          [ -n "$PC_VERSION_NAME" ] || unset PC_VERSION_NAME
          if [ "$AAB_KEY" = upload ]; then
            export PC_UPLOAD_STORE="$RUNNER_TEMP/upload.jks" PC_UPLOAD_STORE_PASSWORD="$UPLOAD_P" PC_UPLOAD_KEY_ALIAS=upload PC_UPLOAD_KEY_PASSWORD="$UPLOAD_P"
          fi
          unset UPLOAD_P
          ./gradlew bundleRelease
      - name: Remove keys
        if: always()
        run: rm -f "$RUNNER_TEMP/sideload.jks" "$RUNNER_TEMP/upload.jks"
      - name: Check release flags
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -E "^package:|uses-permission|debuggable" "$RUNNER_TEMP/badging.txt" || true
          if grep -q "application-debuggable" "$RUNNER_TEMP/badging.txt"; then echo "::error::출시 APK가 debuggable 입니다"; exit 1; fi
          if grep -q "android.permission.INTERNET" "$RUNNER_TEMP/badging.txt"; then echo "::error::출시 APK에 INTERNET 권한이 있습니다 (D-531)"; exit 1; fi
      # 이름에 서명을 밝힌다: 정식 키 = pawnisher-checkmate.apk / .aab · 시험용 디버그 키 = …-TESTKEY.apk / …-TESTKEY-not-for-play.aab
      - name: Name outputs
        run: |
          mkdir -p out
          if [ "$APK_KEY" = sideload ]; then APK_NAME=pawnisher-checkmate.apk; else APK_NAME=pawnisher-checkmate-TESTKEY.apk; fi
          if [ "$AAB_KEY" = upload ]; then AAB_NAME=pawnisher-checkmate.aab; else AAB_NAME=pawnisher-checkmate-TESTKEY-not-for-play.aab; fi
          cp android/app/build/outputs/apk/release/app-release.apk "out/$APK_NAME"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/$AAB_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "AAB_NAME=$AAB_NAME" >> "$GITHUB_ENV"
          echo "### 안드로이드 출시 빌드" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`$APK_NAME\` (서명: $APK_KEY)" >> "$GITHUB_STEP_SUMMARY"
          echo "- AAB: \`$AAB_NAME\` (서명: $AAB_KEY) — Actions 아티팩트, 7일 보관" >> "$GITHUB_STEP_SUMMARY"
      # AAB는 Play Console에 올릴 파일이라 공개 릴리스가 아니라 Actions 아티팩트로 (7일 — D-167 저장 용량)
      - uses: actions/upload-artifact@v4
        with:
          name: pawnisher-aab-${{ env.AAB_KEY }}-${{ github.run_number }}
          retention-days: 7
          path: out/*.aab
      # 항상 같은 주소로 받을 수 있게 'apk-latest' 프리릴리스에 최신 APK를 올린다
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --target "$GITHUB_SHA" --title "최신 테스트 APK" --notes "사용자 요청으로 실행한 테스트 APK"
          # 서명이 다른 옛 파일이 남아 헷갈리지 않게 지우고 올린다
          for f in pawnisher-checkmate.apk pawnisher-checkmate-TESTKEY.apk; do gh release delete-asset apk-latest "$f" -y >/dev/null 2>&1 || true; done
          gh release upload apk-latest "out/$APK_NAME" --clobber
          if [ "$APK_KEY" = sideload ]; then NOTE="출시 빌드 · 직접 설치용 키로 서명 ($GITHUB_SHA)"; else NOTE="출시 빌드 · 시험용 디버그 키로 서명 (TESTKEY — 정식 키로 깐 앱 위에 덮어 깔 수 없습니다) ($GITHUB_SHA)"; fi
          gh release edit apk-latest --notes "$NOTE"
          REL="${{ inputs.release_tag }}"; REL="${REL:-$GITHUB_REF_NAME}"
          if [[ "$REL" == *-test.* ]]; then
            gh release view "$REL" >/dev/null 2>&1 || gh release create "$REL" --prerelease --target "$GITHUB_SHA" --title "검수 빌드 $REL" --notes "검수 대상 커밋: $GITHUB_SHA" || gh release view "$REL"
            gh release upload "$REL" "out/$APK_NAME" --clobber
          fi

  pc:
    needs: test
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.pc && (inputs.make_key == 'none' || inputs.make_key == ''))
    strategy:
      matrix:
        os: ${{ fromJSON((contains(github.ref_name, '-test.') || contains(inputs.release_tag, '-test.')) && '["windows-latest"]' || '["windows-latest","macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run pc:dist -- --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Launch packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SMOKE_SHOT: release/windows-launch.png
          SMOKE_META: release/windows-smoke.json
        run: |
          $app = Get-Item 'release/win-unpacked/Pawnisher Checkmate.exe'
          $p = Start-Process -FilePath $app.FullName -ArgumentList '--smoke-test' -Wait -PassThru -RedirectStandardOutput release/smoke.out -RedirectStandardError release/smoke.err
          Get-Content release/smoke.out
          Get-Content release/smoke.err
          if ($p.ExitCode -ne 0) { throw "Windows launch failed: $($p.ExitCode)" }
          if (-not (Test-Path release/windows-launch.png)) { throw "Windows render proof missing" }
      - name: Publish requested test installers
        if: (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-test.')) || contains(inputs.release_tag, '-test.')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL="${{ inputs.release_tag }}"; REL="${REL:-$GITHUB_REF_NAME}"
          gh release view "$REL" >/dev/null 2>&1 || gh release create "$REL" --prerelease --target "$GITHUB_SHA" --title "검수 빌드 $REL" --notes "검수 대상 커밋: $GITHUB_SHA" || gh release view "$REL"
          gh release upload "$REL" release/*.exe release/windows-launch.png release/windows-smoke.json --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: pawnisher-pc-${{ matrix.os }}
          retention-days: 1
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  # 서명 키 만들기 (D-479, CARPEDIEM과 같은 방식) — 키를 GitHub 안에서 만들어 Secrets 암호로 잠근 파일만 커밋한다
  make-key:
    if: github.event_name == 'workflow_dispatch' && (inputs.make_key == 'sideload' || inputs.make_key == 'upload')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Make and lock the key
        env:
          P_UPLOAD: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
          P_SIDELOAD: ${{ secrets.SIDELOAD_PASSPHRASE }}
          KIND: ${{ inputs.make_key }}
          REPLACE: ${{ inputs.replace_key }}
        run: |
          set -euo pipefail
          if [ "$KIND" = upload ]; then NAME=ANDROID_UPLOAD_PASSPHRASE; P="$P_UPLOAD"; else NAME=SIDELOAD_PASSPHRASE; P="$P_SIDELOAD"; fi
          if [ "$KIND" = upload ] && [ "$P_UPLOAD" = "$P_SIDELOAD" ]; then echo "::error::업로드 키 암호는 직접 설치용 암호와 달라야 합니다"; exit 1; fi
          export P; unset P_UPLOAD P_SIDELOAD
          if [ -z "$P" ]; then echo "::error::Secrets 에 $NAME 가 없습니다"; exit 1; fi
          if [ "${#P}" -lt 16 ]; then echo "::error::$NAME 는 16자 이상이어야 합니다"; exit 1; fi
          mkdir -p android/keystore
          OUT=android/keystore/$KIND.jks.gpg
          if [ -f "$OUT" ] && [ "$REPLACE" != "true" ]; then echo "::error::키가 이미 있습니다 (바꾸려면 replace 를 켜고 실행)"; exit 1; fi
          KS="$RUNNER_TEMP/$KIND.jks"
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$KIND" -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass:env P -keypass:env P -dname "CN=Pawnisher Checkmate $KIND, O=graviton94" >/dev/null
          keytool -list -v -keystore "$KS" -storepass:env P -alias "$KIND" | grep -E "SHA256:" | head -1
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 -o "$OUT" "$KS" 3<<<"$P"
          rm -f "$KS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "New $KIND signing key, locked with the $NAME secret"
          git push
