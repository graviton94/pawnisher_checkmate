# 테스트 + 안드로이드 APK + PC(Windows/macOS/Linux) 빌드 (GDD 10장 M7·M9)
# - push: 테스트와 웹 빌드만 (main 포함 — 자동 APK 없음, D-080)
# - 수동 실행: APK만 (apk-latest 릴리스에 올린다 — 아티팩트 저장 없음, Actions 저장 용량 절약 D-167)
# - PC 설치 파일: v* 태그에서만 (아티팩트 1일 보관)
name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      pc:
        description: 'PC 설치 파일도 만든다 (Windows/macOS/Linux, 약 430MB — 저장 용량을 쓴다)'
        type: boolean
        default: false
  # 태그 푸시는 위 push에도 걸린다

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test
      - run: npm run build

  android:
    needs: test
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest 러너에는 안드로이드 SDK가 이미 설치되어 있다 (ANDROID_HOME)
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run android:apk
      # 항상 같은 주소로 받을 수 있게 'apk-latest' 프리릴리스에 최신 APK를 올린다
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pawnisher-checkmate.apk
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --target "$GITHUB_SHA" --title "최신 테스트 APK" --notes "브랜치에 푸시할 때마다 자동으로 갱신되는 디버그 APK"
          gh release upload apk-latest pawnisher-checkmate.apk --clobber

  pc:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.pc)
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run pc:dist -- --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: pawnisher-pc-${{ matrix.os }}
          retention-days: 1
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
