# 테스트 + 안드로이드 APK + PC(Windows/macOS/Linux) 빌드 (GDD 10장 M7·M9)
# - push: 테스트와 웹 빌드만
# - 수동 실행(Actions 탭 → Build → Run workflow) 또는 v* 태그: APK·PC 설치 파일까지 만들어 아티팩트로 올린다
name: Build

on:
  push:
  workflow_dispatch:
  # 태그 푸시는 위 push에도 걸린다

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test
      - run: npm run build

  android:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/claude/hopeful-hamilton-em7jaw'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest 러너에는 안드로이드 SDK가 이미 설치되어 있다 (ANDROID_HOME)
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: pawnisher-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  pc:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/claude/hopeful-hamilton-em7jaw'
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run pc:dist -- --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: pawnisher-pc-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
